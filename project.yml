name: TypingMirror
options:
  bundleIdPrefix: com.akhilkonduru
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # A stable signature matters here: macOS ties the Accessibility grant to it,
    # so ad-hoc signing makes the user re-approve after every single rebuild.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "236EA3A04B9CD9A467D96AC165FAD04803BB00C4"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: 87459B8PDS
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ALWAYS_SEARCH_USER_PATHS: NO

packages:
  TypingMirrorKit:
    path: Packages/TypingMirrorKit

targets:
  TypingMirror:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    # XcodeGen has no target-level `resources` key: everything is declared under
    # `sources` and categorised by extension. Listing the catalog anywhere else
    # silently omits it from the project.
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: TypingMirrorKit
        product: TypingMirrorKit
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: TypingMirror
        CFBundleDisplayName: TypingMirror
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        # With a hand-written Info.plist, Xcode does not inject this, and without
        # it the compiled asset-catalog icon is never used.
        CFBundleIconName: AppIcon
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Copyright © 2026 Akhil Konduru"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: false
    entitlements:
      path: Resources/TypingMirror.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akhilkonduru.TypingMirror
        PRODUCT_NAME: TypingMirror
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO

schemes:
  TypingMirror:
    build:
      targets:
        TypingMirror: all
    run:
      config: Debug
